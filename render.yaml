# Render deployment config. Push this repo to GitHub, then on render.com:
# New +  ->  Web Service  ->  connect this repo. Render auto-detects this file.
services:
  - type: web
    name: dilpreet-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
